<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WizNote My">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https:; connect-src https://www.googleapis.com https://*.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<title>WizNote My</title>
</head>
<body>
<div id="login-view" class="center" hidden>
  <img src="icons/icon-180.png" alt="" width="84" height="84">
  <h1>WizNote My</h1>
  <p class="muted">閱讀電腦版同步到 Google 雲端硬碟的筆記，也可以加入最愛、刪除和修改文字。</p>
  <button id="login" class="primary" type="button">登入 Google</button>
</div>

<div id="home-view" hidden>
  <header class="bar">
    <div class="bar-row">
      <button id="folder-back" class="icon" type="button" aria-label="回上一層" hidden>‹</button>
      <h1 id="home-title">全部筆記</h1>
      <button id="settings" class="icon" type="button" aria-label="設定">⚙︎</button>
    </div>
    <input id="search" type="search" placeholder="搜尋標題與摘要" aria-label="搜尋" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="all">全部</button>
      <button class="tab" type="button" role="tab" data-tab="fav">♥ 最愛</button>
      <button class="tab" type="button" role="tab" data-tab="folders">分類</button>
    </div>
    <div id="banner" class="banner" hidden></div>
  </header>
  <div class="sortbar">
    <span id="count" class="muted"></span>
    <select id="sort" aria-label="排序方式">
      <option value="m">修改時間</option>
      <option value="c">建立時間</option>
      <option value="t">標題</option>
    </select>
    <button id="order" type="button"></button>
  </div>
  <div id="folders" hidden></div>
  <button id="search-full" class="wide" type="button" hidden></button>
  <div id="list"></div>
  <div id="sentinel"></div>
</div>

<div id="note-view" hidden>
  <header class="bar">
    <div class="bar-row">
      <button id="note-back" class="icon" type="button" aria-label="返回">‹</button>
      <h1 id="note-title"></h1>
      <button id="note-toc" class="icon" type="button" aria-label="問題目錄" hidden>☰</button>
      <button id="note-fav" class="icon fav-toggle" type="button" aria-label="加入我的最愛">♡</button>
      <button id="note-edit" class="icon" type="button" aria-label="修改內文" disabled>✎</button>
      <button id="note-trash" class="icon" type="button" aria-label="刪除">🗑</button>
      <button id="edit-cancel" class="text-btn" type="button" hidden>取消</button>
      <button id="edit-save" class="text-btn primary" type="button" hidden>儲存</button>
    </div>
  </header>
  <div id="note-banner" class="banner" hidden></div>
  <article>
    <p id="note-meta" class="muted"></p>
    <div id="note-actions" class="actions"></div>
    <div id="note-body" class="content"></div>
    <p id="edit-hint" class="muted" hidden>直接修改文字即可。<code>![image](…)</code> 這類行是圖片，刪掉圖片就不見了。</p>
    <textarea id="note-editor" aria-label="內文" spellcheck="false" autocapitalize="off" hidden></textarea>
  </article>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-box">
    <h2>設定</h2>
    <p id="sheet-account" class="muted"></p>
    <p id="sheet-storage" class="muted"></p>
    <p id="sheet-pending" class="muted"></p>
    <div id="style-box">
      <h3>閱讀樣式</h3>
      <div class="style-row"><span>底色</span><div class="seg" data-key="theme">
        <button type="button" data-v="auto">自動</button><button type="button" data-v="white">純白</button><button type="button" data-v="paper">紙張</button><button type="button" data-v="green">護眼</button><button type="button" data-v="night">夜間</button>
      </div></div>
      <div class="style-row"><span>字級</span><div class="seg" data-key="size">
        <button type="button" data-v="15">小</button><button type="button" data-v="17">中</button><button type="button" data-v="19">大</button><button type="button" data-v="21">特大</button>
      </div></div>
      <div class="style-row"><span>粗體</span><div class="seg" data-key="boldc">
        <button type="button" data-v="on">帶顏色</button><button type="button" data-v="off">只加粗</button>
      </div></div>
      <div class="style-row"><span>對話</span><div class="seg" data-key="bubble">
        <button type="button" data-v="on">問題加底色</button><button type="button" data-v="off">一般文字</button>
      </div></div>
    </div>
    <button id="refresh" class="wide" type="button">立即更新筆記清單</button>
    <button id="clear-cache" class="wide" type="button">清除手機上的離線內容</button>
    <button id="logout" class="wide" type="button">登出</button>
    <button id="sheet-close" class="wide primary" type="button">關閉</button>
  </div>
</div>

<div id="jump" hidden>
  <button id="jump-top" type="button" aria-label="到最上面">↑</button>
  <button id="jump-bottom" type="button" aria-label="到最下面">↓</button>
</div>

<div id="toc" class="sheet" hidden>
  <div class="sheet-box toc-box">
    <div class="toc-head"><h2>問題目錄</h2><span id="toc-count" class="muted"></span></div>
    <div id="toc-list"></div>
    <button id="toc-close" class="wide primary" type="button">關閉</button>
  </div>
</div>

<div id="toast" hidden></div>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
